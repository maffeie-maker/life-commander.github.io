<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
  }

  .top-bar {
    display: flex;
    align-items: center;
    padding: 14px 20px;
  }

  .back {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 13px; color: #0071e3; text-decoration: none;
  }

  .columns {
    display: flex;
    gap: 14px;
    height: calc(100vh - 56px);
    padding: 0 14px 14px;
  }

  .col {
    background: #fff;
    border-radius: 28px;
    border: 0.5px solid rgba(0,0,0,0.06);
    box-shadow: 0 10px 30px rgba(0,0,0,0.16);
    overflow: hidden;
  }

  .col iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .col-meteo { flex: 0 0 26%; }
  .col-tvradio { flex: 1 1 48%; }
  .col-news { flex: 0 0 26%; }

  @media (max-width: 900px) {
    .columns { flex-direction: column; height: auto; }
    .col { flex: none !important; height: 70vh; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <a class="back" href="../index.html"><i class="ti ti-chevron-left" aria-hidden="true"></i> Life Commander</a>
</div>

<div class="columns">
  <div class="col col-meteo">
    <iframe src="meteo-posizione.html" title="Meteo"></iframe>
  </div>
  <div class="col col-tvradio">
    <iframe src="tv-radio.html" title="TV + Radio"></iframe>
  </div>
  <div class="col col-news">
    <iframe src="world-news.html" title="World News"></iframe>
  </div>
</div>

</body>
</html>
