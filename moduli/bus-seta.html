<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bus SETA · Reggio Emilia</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--mu:#6e6e73;--ac:#0071e3;--ok:#248a3d;--wa:#c93400;--ln:#d2d2d7;--gl:rgba(245,245,247,.74);--sh:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06)}
[data-theme=dark]{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--ac:#2997ff;--ok:#30d158;--wa:#ff6a4d;--ln:#3a3a3c;--gl:rgba(28,28,30,.74);--sh:none}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,"SF Pro Text",Inter,system-ui,sans-serif}
#map{position:fixed;inset:0;z-index:0;background:var(--ln)}
[data-theme=dark] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
.leaflet-bottom.leaflet-right{margin-bottom:env(safe-area-inset-bottom)}
.panel{position:fixed;z-index:1100;left:8px;right:8px;bottom:calc(26px + env(safe-area-inset-bottom));max-height:62vh;max-height:62dvh;overflow-y:auto;overscroll-behavior:contain;padding:10px;border-radius:24px;background:var(--gl);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 8px 32px rgba(0,0,0,.18);animation:in .35s backwards}
.tools{position:fixed;z-index:1100;right:12px;top:calc(12px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
header{display:flex;align-items:center;gap:10px;padding:2px 6px 10px}
header h1{font-size:1.2rem;font-weight:600;letter-spacing:-.02em;margin:0;flex:1}
header small{color:var(--mu);font-size:.78rem;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-size:.85rem;background:var(--card);color:var(--tx);border:0;border-radius:980px;padding:7px 14px;box-shadow:var(--sh),0 1px 6px rgba(0,0,0,.12);cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.96)}
.lines{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:thin;scrollbar-color:var(--ln) transparent;cursor:grab}
.lines::-webkit-scrollbar{height:6px}.lines::-webkit-scrollbar-thumb{background:var(--ln);border-radius:3px}
.ln{flex:none;font:inherit;font-size:.85rem;font-weight:600;min-width:44px;padding:7px 12px;border:0;border-radius:980px;background:var(--card);color:var(--tx);cursor:pointer;box-shadow:var(--sh);transition:transform .1s}
.ln:active{transform:scale(.95)}
.ln{user-select:none;-webkit-user-select:none}.nb{margin-left:6px;font-size:.7rem;font-weight:500;opacity:.7}
.flt{margin:0 2px 8px}
.bmk.oth span{width:24px;height:24px;margin:3px;color:var(--t,#fff);font-size:9px}
.ln::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}
.ln[aria-pressed=true]{background:var(--c);color:var(--t)}
.ln[aria-pressed=true]::before{display:none}
.card{background:var(--card);border-radius:18px}
.ch{display:flex;align-items:center;gap:8px;width:100%;padding:14px 16px;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;text-align:left}
.ch:active{opacity:.7}
.ch .lb{flex:1}
.sum{display:none;font-size:.85rem;color:var(--mu);max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col .sum{display:inline}
.chev{flex:none;width:8px;height:8px;margin-left:6px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);transition:transform .25s}
.col .chev{transform:rotate(-45deg)}
.cb{display:grid;grid-template-rows:1fr;transition:grid-template-rows .25s ease}
.col .cb{grid-template-rows:0fr}
.in{min-height:0;overflow:hidden}
.pad{padding:0 12px 12px}
.lb{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:600}
.sub{color:var(--mu);font-size:.82rem}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:980px;background:color-mix(in srgb,var(--c,var(--ok)) 14%,transparent);color:var(--c,var(--ok))}
.msg{color:var(--mu);font-size:.92rem;margin:4px 4px 0}
.drow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--ln);border-radius:14px;padding:12px 14px;margin-top:8px;cursor:pointer;transition:transform .1s}
.drow:first-child{margin-top:0}
.drow:active{transform:scale(.99)}
.drow[aria-pressed=true]{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent)}
.drow b{font-size:1.05rem;font-weight:600;letter-spacing:-.01em}
.dblk{margin-top:8px}.dblk:first-child{margin-top:0}
.drow{margin-top:0}
.drow.cmp{padding:9px 14px}.drow.cmp b{font-size:.95rem}
.its{display:flex;flex-wrap:wrap;gap:6px;margin:8px 2px 2px}
.itc{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.8rem;font-weight:500;padding:6px 11px;border-radius:980px;border:1.5px solid var(--ln);background:transparent;color:inherit;cursor:pointer}
.itc i{width:8px;height:8px;border-radius:50%}
.itc[aria-pressed=true]{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent)}
.vt{display:inline-flex;align-items:center;gap:5px;font-weight:600;opacity:1}.vt i{width:8px;height:8px;border-radius:50%}
.bmk.un span{background:#8e8e93}.bmk.stale span{opacity:.5}
.bmk span{display:flex;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font:600 10px/1 -apple-system,system-ui,sans-serif;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.bmk.on{--c:var(--ac)}.bmk.off{--c:#8e8e93}
.stp{background:var(--card);color:var(--tx);border:0;box-shadow:var(--sh);font-size:11px;font-weight:600}
.pr{display:flex;justify-content:space-between;gap:16px;font-size:.85rem;line-height:1.6}.pr span{opacity:.65}
.pl{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin:4px 0}
.dp{display:grid;grid-template-columns:auto 1fr;gap:0 12px;padding:6px 0;border-top:1px solid rgba(128,128,128,.25)}
.dp span{font-size:.85rem}.dp em{grid-column:2;font-style:normal;opacity:.65;font-size:.78rem}
[data-theme=dark] .leaflet-popup-content-wrapper,[data-theme=dark] .leaflet-popup-tip{background:#1c1c1e;color:#f5f5f7}
@media(min-width:800px){.panel{left:16px;right:auto;top:16px;bottom:auto;width:380px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px)}.tools{top:16px;right:16px}}
@media(max-width:799px){.leaflet-control-zoom{display:none}}
@media(prefers-reduced-motion:reduce){.panel{animation:none}.btn,.ln,.drow,.cb,.chev{transition:none}}
@media(prefers-reduced-transparency:reduce){.panel{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media(prefers-contrast:more){.card,.drow{outline:1px solid var(--tx)}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Mappa delle linee SETA"></div>
<div class="tools">
  <button class="btn" id="tp">Mappa</button>
  <button class="btn" id="fit">Centra</button>
  <button class="btn" id="fitv" hidden>Tutti i bus</button>
</div>
<div class="panel">
  <header>
    <h1>Bus SETA</h1>
    <small id="clock"></small>
    <button class="btn" id="theme">Scuro</button>
  </header>
  <div class="flt"><button class="itc" id="act" aria-pressed="false">Solo linee con bus in servizio<span class="nb" id="actn"></span></button></div>
  <div class="lines" id="lines" role="group" aria-label="Linea"></div>
  <section class="card" id="c-dir"><button class="ch" aria-expanded="true"><span class="lb" id="dl">Direzioni</span><span class="sum" id="ds"></span><i class="chev"></i></button><div class="cb"><div class="in"><div class="pad" id="dirs"></div></div></div></section>
  <p class="sub" id="foot" style="margin:10px 8px 2px;font-size:.75rem"></p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="data/index.js"></script>
<script>
const BASE='https://proxy.busone.app/seta-re/gtfs-rt/';
// Facoltativo: organizzazione/app e un contatto, come richiesto dalle condizioni di BusOne (es. 'Famiglia/BusSeta; nome@esempio.it').
const CLIENT='';
const POS_EVERY=20000,TU_EVERY=60000;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const hm=t=>new Date(t).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',hour12:false});
const pretty=s=>String(s||'').toLowerCase().replace(/(^|[\s\-.'(\/])([a-zà-ù])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(Fs|Cim\d*|Aci|Av|Asl|Re|Mo|Usl|Peep)\b/g,m=>m.toUpperCase()).replace(/(.)\b(In|Di|Del|Della|Dei|Da|Al|E)\b/g,(m,p,w)=>p+w.toLowerCase()).replace(/\s+/g,' ').trim();
const info=id=>BS.lines.find(l=>l[0]===id);
let ROUTE=ls.g('bs.line'),LN=null,dirSel=Number(ls.g('bs.dir'))===1?1:0,vehAll=[],unas=[],tuAll={},posAt=0,tuAt=0,tripDir={},tripVar={},itSel=null;
if(!info(ROUTE))ROUTE=info('RE82')?'RE82':BS.lines[0][0];
let actOnly=ls.g('bs.act')==='1',linesKey='';
const veh=()=>vehAll.filter(v=>v.route===ROUTE),tu=()=>tuAll[ROUTE]||{};
const dirOf=v=>v.d!=null?Number(v.d):(tripDir[v.trip]!=null?tripDir[v.trip]:-1);

function theme(t){document.documentElement.dataset.theme=t;$('#theme').textContent=t==='dark'?'Chiaro':'Scuro';ls.s('bs.theme',t)}
theme(ls.g('bs.theme')==='dark'?'dark':'light');
$('#theme').onpointerdown=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
function clock(){const d=new Date();$('#clock').textContent=d.toLocaleDateString('it-IT',{day:'numeric',month:'short'})+' · '+hm(d)}
clock();setInterval(()=>{clock();render()},30000);

// Card collassabile
let collapsed=ls.g('bs.col')==='1';
function applyCol(){$('#c-dir').classList.toggle('col',collapsed);$('#c-dir .ch').setAttribute('aria-expanded',String(!collapsed))}
$('#c-dir .ch').onclick=()=>{collapsed=!collapsed;ls.s('bs.col',collapsed?'1':'0');applyCol()};applyCol();

// Dati in tempo reale (BusOne, GTFS-Realtime in JSON)
async function getJSON(name){
  const u=BASE+name+'.json';
  if(CLIENT){try{const r=await fetch(u,{headers:{'X-BusOne-Client':CLIENT,'X-BusOne-Use':'personal'}});if(r.ok)return r.json()}catch(e){}}
  const r=await fetch(u);if(!r.ok)throw 0;return r.json();
}
async function loadPos(){
  try{const j=await getJSON('vehicle-positions');
    const all=(j.entity||[]).map(e=>e.vehicle).filter(v=>v&&v.position);
    unas=all.filter(v=>!(v.trip&&v.trip.trip_id)).map(v=>({id:String(v.vehicle&&(v.vehicle.id||v.vehicle.label)||'?'),label:v.vehicle&&v.vehicle.label,plate:v.vehicle&&v.vehicle.license_plate,lat:v.position.latitude,lon:v.position.longitude,ts:v.timestamp}));
    vehAll=all.filter(v=>v.trip&&v.trip.trip_id)
      .map(v=>({route:v.trip.route_id,id:String(v.vehicle&&v.vehicle.id||v.trip.trip_id),label:v.vehicle&&v.vehicle.label,plate:v.vehicle&&v.vehicle.license_plate,trip:v.trip.trip_id,d:v.trip.direction_id,start:v.trip.start_time,lat:v.position.latitude,lon:v.position.longitude,b:v.position.bearing,stop:v.stop_id,st:v.current_status,ts:v.timestamp}));
    posAt=Date.now();
  }catch(e){}
  render();
}
async function loadTu(){
  try{const j=await getJSON('trip-updates'),n={};
    for(const e of j.entity||[]){const t=e.trip_update;if(t&&t.trip)(n[t.trip.route_id]||(n[t.trip.route_id]={}))[t.trip.trip_id]=t.stop_time_update||[]}
    tuAll=n;tuAt=Date.now();
  }catch(e){}
  render();
}

// Orari: GTFS statico, sostituito dalla previsione quando c’è
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
const calC={},calS=s=>calC[s]||(calC[s]=new Set(BS.cal[s]||[]));
function departures(sid,n,d,it){
  const now=Date.now(),out=[],T=tu();
  for(let k=-1;k<3;k++){
    const day=new Date();day.setDate(day.getDate()+k);day.setHours(0,0,0,0);
    const key=ymd(day),t0=day.getTime();
    for(const [tid,svc,start,vi] of LN.trips){
      if(!calS(svc).has(key))continue;
      const v=LN.vars[vi],i=v.s.indexOf(sid);
      if(i<0||i===v.s.length-1||(d!=null&&v.d!==d)||(it!=null&&!v.i.includes(it)))continue;
      let t=t0+(start+v.o[i])*1000,rt=false,delay=0;
      if(k===0){const u=(T[tid]||[]).find(x=>x.stop_id===sid),x=u&&(u.departure&&u.departure.time?u.departure:u.arrival);
        if(x&&x.time){t=x.time*1000;delay=x.delay||0;rt=true}}
      if(t>=now-60000)out.push({t,rt,delay,to:v.s[v.s.length-1],its:v.i,tid,rs:t0+start*1000,re:t0+(start+v.o[v.o.length-1])*1000});
    }
  }
  return out.sort((a,b)=>a.t-b.t).slice(0,n);
}
const dl=s=>Math.abs(s)<60?'in orario':s>0?`+${Math.round(s/60)} min`:`${Math.round(-s/60)} min in anticipo`;
const when=(t,now)=>{const m=Math.round((t-now)/60000),same=new Date(t).toDateString()===new Date(now).toDateString();
  return !same?`domani ${hm(t)}`:m<=0?'ora':m<60?`tra ${m} min`:`tra ${Math.floor(m/60)} h ${m%60} min`};

// Pannello
const activeCounts=()=>{const c={};for(const v of vehAll)c[v.route]=(c[v.route]||0)+1;return c};
function renderLines(force){
  const c=activeCounts(),list=BS.lines.filter(l=>!actOnly||c[l[0]]||l[0]===ROUTE);
  const key=ROUTE+'|'+actOnly+'|'+list.map(l=>l[0]+(actOnly?':'+(c[l[0]]||0):'')).join(',');
  if(!force&&key===linesKey)return;linesKey=key;
  const box=$('#lines'),sl=box.scrollLeft;
  box.innerHTML=list.map(l=>`<button class="ln" data-id="${l[0]}" aria-pressed="${l[0]===ROUTE}" style="--c:#${l[3]};--t:#${l[4]}" title="${esc(l[2])}">${esc(l[1])}${actOnly&&c[l[0]]?`<span class="nb">${c[l[0]]}</span>`:''}</button>`).join('');
  box.scrollLeft=sl;
  const el=$('.ln[aria-pressed=true]');if(force&&el&&el.scrollIntoView)el.scrollIntoView({inline:'center',block:'nearest'});
}
function setAct(on){actOnly=on;ls.s('bs.act',on?'1':'0');$('#act').setAttribute('aria-pressed',String(on));$('#fitv').hidden=!on;renderLines(true);render()}
$('#act').onclick=()=>{setAct(!actOnly);if(actOnly)fitVeh()};
$('#act').setAttribute('aria-pressed',String(actOnly));$('#fitv').hidden=!actOnly;
// Elenco linee scorrevole anche con il mouse: rotella e trascinamento
(()=>{const el=$('#lines');let down=false,sx=0,sl=0,moved=false;
  el.addEventListener('wheel',e=>{if(el.scrollWidth>el.clientWidth&&Math.abs(e.deltaY)>=Math.abs(e.deltaX)){el.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
  el.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;down=true;moved=false;sx=e.clientX;sl=el.scrollLeft});
  addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;if(Math.abs(dx)>4)moved=true;el.scrollLeft=sl-dx});
  addEventListener('pointerup',()=>{down=false});
  el.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
})();
$('#lines').onclick=e=>{const b=e.target.closest('.ln');if(b&&b.dataset.id!==ROUTE)pick(b.dataset.id)};
$('#dirs').onclick=e=>{const c=e.target.closest('.itc');if(c)return setIt(c.dataset.k===''?null:Number(c.dataset.k));const b=e.target.closest('.drow');if(b)setDir(Number(b.dataset.d))};
const PAL=['#0a84ff','#ff9f0a','#30b0c7','#bf5af2','#ff375f'];
const ITS=()=>LN.its[dirSel]||[];
const vis=()=>itSel==null?ITS().map((_,k)=>k):[itSel];
const itLab=k=>ITS()[k].v?'via '+pretty(ITS()[k].v):'Percorso '+(k+1);
const itCol=k=>ITS().length>1?PAL[k%PAL.length]:lineColor();
const tripIts=t=>tripVar[t]==null?[]:LN.vars[tripVar[t]].i;
const shown=()=>veh().filter(v=>dirOf(v)===dirSel&&(itSel==null||tripIts(v.trip).includes(itSel)));
const tag=its=>its.length===1&&ITS().length>1?`<span class="vt"><i style="background:${PAL[its[0]%PAL.length]}"></i>${esc(itLab(its[0]))}</span> · `:'';
function setDir(d){if(d===dirSel)return;dirSel=d;itSel=null;ls.s('bs.dir',d);drawLine();render();fitLine()}
function setIt(k){itSel=k;drawLine();render();fitLine()}
const GRACE=180000,STALE_S=120; // tolleranza prima di aspettarsi il mezzo nel feed; secondi oltre cui la posizione è considerata ferma
const feedOk=()=>posAt&&Date.now()-posAt<90000;
const ageS=v=>v.ts?Math.max(0,Math.round(Date.now()/1000-v.ts)):0;
const dseg=(p,a,b)=>{const k=Math.cos(p[0]*Math.PI/180),px=p[1]*k,py=p[0],ax=a[1]*k,ay=a[0],bx=b[1]*k,by=b[0],dx=bx-ax,dy=by-ay,t=dx||dy?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy))):0;return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))*111320};
const nearShape=ll=>vis().some(k=>{const sh=ITS()[k].sh;for(let i=0;i<sh.length-1;i++)if(dseg(ll,sh[i],sh[i+1])<300)return true;return false});
function missingTrips(){
  const out=[];if(!feedOk()||!LN)return out;
  const now=Date.now(),day=new Date();day.setHours(0,0,0,0);const key=ymd(day),t0=day.getTime();
  for(const [tid,svc,start,vi] of LN.trips){const v=LN.vars[vi];
    if(v.d!==dirSel||(itSel!=null&&!v.i.includes(itSel))||!calS(svc).has(key))continue;
    const rs=t0+start*1000,re=t0+(start+v.o[v.o.length-1])*1000;
    if(now>=rs+GRACE&&now<=re+600000&&!vehAll.some(x=>x.trip===tid))out.push({tid,rs,re,from:v.s[0],to:v.s[v.s.length-1]});
  }
  return out.sort((a,b)=>a.rs-b.rs);
}
function render(){
  if(!LN)return;
  renderLines();$('#actn').textContent=actOnly?' · '+Object.keys(activeCounts()).length+' linee':'';
  const now=Date.now(),L=info(ROUTE),ITSd=ITS(),mt=missingTrips();
  $('#dl').textContent=`Linea ${L[1]} · direzioni`;
  $('#ds').textContent='verso '+pretty(itSel!=null?ITSd[itSel].to:LN.dirs[dirSel].to)+(itSel!=null&&ITSd[itSel].v?' · '+itLab(itSel):'')+(mt.length?' · ⚠':'');
  $('#dirs').innerHTML=Object.keys(LN.dirs).map(k=>{
    const d=+k,D=LN.dirs[d];
    if(d!==dirSel)return `<div class="dblk"><button class="drow cmp" data-d="${d}" aria-pressed="false"><span class="lb">Verso</span><b>${esc(pretty(D.to))}</b><span class="sub">da ${esc(pretty(D.from))}</span></button></div>`;
    const it=itSel!=null?ITSd[itSel]:null,fromId=it?it.st[0]:D.fromId,from=it?it.fr:D.from,to=it?it.to:D.to;
    const dep=departures(fromId,1,d,itSel)[0],n=shown().length;
    const chips=ITSd.length>1?`<div class="its"><button class="itc" data-k="" aria-pressed="${itSel==null}">Tutti i percorsi</button>`+ITSd.map((x,i)=>`<button class="itc" data-k="${i}" aria-pressed="${itSel===i}"><i style="background:${PAL[i%PAL.length]}"></i>${esc(itLab(i))}</button>`).join('')+'</div>':'';
    return `<div class="dblk"><button class="drow" data-d="${d}" aria-pressed="true"><span class="lb">Verso</span><b>${esc(pretty(to))}</b><span class="sub">da ${esc(pretty(from))}</span>`+
      `<span class="sub">${dep?`Prossima partenza ${hm(dep.t)} · ${when(dep.t,now)}`+(dep.rt?` · <span class="chip"${dep.delay>=60?' style="--c:var(--wa)"':''}>${dl(dep.delay)}</span>`:' · da orario'):'Nessuna partenza programmata'}</span>`+
      `<span class="sub">${n?`${n} bus in servizio`:'Nessun bus in servizio ora'}</span>`+(mt.length?`<span class="sub" style="color:var(--wa)">⚠ ${mt.length===1?'1 corsa attesa':mt.length+' corse attese'} senza mezzo nel feed (la prima: ore ${hm(mt[0].rs)} da ${esc(pretty(LN.stops[mt[0].from][0]))}). Può essere un problema di telemetria o una corsa non effettuata.</span>`:'')+`</button>${chips}</div>`}).join('');
  updateMap();
  if(popCur)popCur.update();
  const late=BS.until&&ymd(new Date())>BS.until?` · orari statici scaduti il ${BS.until.slice(6)}/${BS.until.slice(4,6)}`:'';
  $('#foot').textContent=(posAt?`Posizioni alle ${hm(posAt)} · `:'Posizioni non disponibili · ')+(tuAt?`previsioni alle ${hm(tuAt)} · `:'previsioni non disponibili, uso gli orari · ')+'fonte BusOne, dati non ufficiali SETA'+late;
}

// Mappa
const TP={esri:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}','Tiles © Esri','Esri'],osm:['https://tile.openstreetmap.org/{z}/{x}/{y}.png','© OpenStreetMap contributors','OSM']};
let tp=ls.g('bs.tile')==='osm'?'osm':'esri';
var M=null,TL=null;let LL=null,SH=[],SM={},MK={},mapAt=0,animT=0,popCur=null;
const pad=()=>innerWidth>=800?{paddingTopLeft:[420,70],paddingBottomRight:[70,70]}:{paddingTopLeft:[30,80],paddingBottomRight:[30,($('.panel').offsetHeight||300)+40]};
function addTiles(){if(TL)M.removeLayer(TL);const p=TP[tp];TL=L.tileLayer(p[0],{maxZoom:18,attribution:p[1]}).addTo(M);$('#tp').textContent='Mappa: '+p[2]}
function initMap(){
  if(M||!window.L)return;
  M=L.map('map',{maxZoom:18,zoomControl:false});L.control.zoom({position:'bottomright'}).addTo(M);
  M.setView([44.6983,10.6307],12);addTiles();LL=L.layerGroup().addTo(M);
  M.on('popupopen',e=>{popCur=e.popup;const el=e.popup.getElement();if(el&&!el._pk){el._pk=1;el.addEventListener('click',ev=>{const a=ev.target.closest('a.pk');if(a){ev.preventDefault();pick(a.dataset.id)}})}});M.on('popupclose',()=>{popCur=null});
  $('#fit').onpointerdown=fitLine;$('#fitv').onpointerdown=fitVeh;
  $('#tp').onpointerdown=()=>{tp=tp==='esri'?'osm':'esri';ls.s('bs.tile',tp);addTiles()};
}
function lineColor(){const c=info(ROUTE)[3],n=parseInt(c,16),lum=(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255;return lum>.8?'#6e6e73':'#'+c}
function fitLine(){
  if(!M||!LN)return;const pts=[];
  for(const k of vis())for(const s of ITS()[k].st)pts.push([LN.stops[s][1],LN.stops[s][2]]);
  if(pts.length)M.fitBounds(pts,{...pad(),maxZoom:15});
}
function stopPopup(id){
  const now=Date.now(),dep=departures(id,5,dirSel,itSel);
  return `<b>${esc(pretty(LN.stops[id][0]))}</b><div class="pl">Prossime partenze · linea ${esc(info(ROUTE)[1])}</div>`+
    (dep.length?dep.map(e=>`<div class="dp"><b>${hm(e.t)}</b><span>verso ${esc(pretty(LN.stops[e.to][0]))}</span><em>${tag(e.its)}${when(e.t,now)}${e.rt?' · '+dl(e.delay):' · da orario'}${feedOk()&&now>=e.rs+GRACE&&now<=e.re+600000&&!vehAll.some(v=>v.trip===e.tid)?' · <b style="color:#c93400">⚠ nessun mezzo nel feed</b>':''}</em></div>`).join(''):'<div class="msg" style="margin:0">Nessuna partenza da questa fermata (è un capolinea di arrivo).</div>');
}
// Mostra solo la direzione scelta (e, se scelto, un solo percorso): linee, fermate e bus
function drawLine(){
  if(!M||!LN)return;LL.clearLayers();SM={};
  const its=ITS(),cnt={};
  for(const k of vis()){L.polyline(its[k].sh,{color:itCol(k),weight:6,opacity:.9}).addTo(LL);for(const s of its[k].st)(cnt[s]||(cnt[s]=[])).push(k)}
  for(const id in cnt){const s=LN.stops[id],ks=cnt[id];
    SM[id]=L.circleMarker([s[1],s[2]],{radius:5,weight:3,fillColor:'#fff',fillOpacity:1,color:ks.length===1?itCol(ks[0]):'#6e6e73'}).addTo(LL)
      .bindTooltip(esc(pretty(s[0])),{direction:'top',offset:[0,-4],className:'stp'}).bindPopup(()=>stopPopup(id),{minWidth:220})
      .on('popupopen',e=>e.target.closeTooltip())}
}
const CS={IN_TRANSIT_TO:'In viaggio verso',INCOMING_AT:'In arrivo a',STOPPED_AT:'Ferma a'};
function popup(v){
  const D=LN.dirs[dirOf(v)],ii=tripIts(v.trip),u=(tu()[v.trip]||[]).find(x=>x.stop_id===v.stop),x=u&&(u.arrival&&u.arrival.time?u.arrival:u.departure);
  const age=v.ts?Math.max(0,Math.round(Date.now()/1000-v.ts)):null;
  const rows=[['Corsa',D&&'verso '+pretty(D.to)],['Percorso',ii.length===1&&ITS().length>1&&itLab(ii[0])],['Partita alle',v.start&&v.start.slice(0,5)],['Targa',v.plate],
    [CS[v.st]||'Prossima fermata',v.stop&&LN.stops[v.stop]&&pretty(LN.stops[v.stop][0])],['Previsto alle',x&&x.time&&hm(x.time*1000)],['Ritardo',x&&x.delay!=null&&dl(x.delay)],
    ['Direzione',v.b!=null&&['N','NE','E','SE','S','SO','O','NO'][Math.round(v.b/45)%8]],['Aggiornato',age!=null&&age+' s fa'],['Telemetria',ageS(v)>STALE_S&&`ferma da ${Math.round(ageS(v)/60)} min`]];
  return `<b>Bus ${esc(v.label||v.id)}</b>`+rows.filter(r=>r[1]).map(r=>`<div class="pr"><span>${r[0]}</span><b>${esc(r[1])}</b></div>`).join('');
}
function popupOther(v){
  const li=info(v.route),u=(tuAll[v.route]||{})[v.trip]||[],x=u.find(a=>a.stop_id===v.stop),xx=x&&(x.arrival&&x.arrival.time?x.arrival:x.departure);
  const age=v.ts?Math.max(0,Math.round(Date.now()/1000-v.ts)):null;
  const rows=[['Linea',li&&li[1]],['Percorso',li&&li[2]],['Partita alle',v.start&&v.start.slice(0,5)],['Targa',v.plate],['Previsto alle',xx&&xx.time&&hm(xx.time*1000)],['Ritardo',xx&&xx.delay!=null&&dl(xx.delay)],['Aggiornato',age!=null&&age+' s fa'],['Telemetria',ageS(v)>STALE_S&&`ferma da ${Math.round(ageS(v)/60)} min`]];
  return `<b>Bus ${esc(v.label||v.id)}</b>`+rows.filter(r=>r[1]).map(r=>`<div class="pr"><span>${r[0]}</span><b>${esc(r[1])}</b></div>`).join('')+`<p style="margin:8px 0 0"><a href="#" class="pk" data-id="${esc(v.route)}">Mostra la linea ${esc(li?li[1]:'')}</a></p>`;
}
function fitVeh(){if(!M)return;const p=vehAll.map(v=>[v.lat,v.lon]);if(p.length)M.fitBounds(p,{...pad(),maxZoom:13})}
function popupUn(v){
  const rows=[['Stato','senza corsa assegnata'],['Targa',v.plate],['Matricola',v.label],['Aggiornato',v.ts?ageS(v)+' s fa':null],['Telemetria',ageS(v)>STALE_S&&`ferma da ${Math.round(ageS(v)/60)} min`]];
  return `<b>Mezzo non assegnato</b>`+rows.filter(r=>r[1]).map(r=>`<div class="pr"><span>${r[0]}</span><b>${esc(r[1])}</b></div>`).join('');
}
function updateMap(){
  initMap();
  if(!M){$('#map').textContent='Mappa non disponibile: libreria non caricata.';return}
  const own=shown(),vs=own.concat(actOnly?vehAll.filter(v=>v.route!==ROUTE):[]).concat(unas.filter(u=>nearShape([u.lat,u.lon])).map(u=>({...u,un:true,id:'u'+u.id,route:null}))),ids=new Set(vs.map(v=>v.id));
  for(const id in MK)if(!ids.has(id)){M.removeLayer(MK[id].m);delete MK[id]}
  const fresh=mapAt!==posAt;mapAt=posAt;
  const still=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
  for(const v of vs){
    let k=MK[v.id];
    if(!k)k=MK[v.id]=({m:L.marker([v.lat,v.lon],{icon:L.divIcon({className:'bmk',html:'<span></span>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(M),from:[v.lat,v.lon],to:[v.lat,v.lon],t0:0});
    const el=k.m.getElement();
    if(el){const mine=v.route===ROUTE,li=v.un?null:info(v.route);el.classList.toggle('on',mine&&!v.un);el.classList.toggle('oth',!mine&&!v.un);el.classList.toggle('un',!!v.un);el.classList.toggle('stale',ageS(v)>STALE_S);if(!mine&&li){el.style.setProperty('--c','#'+li[3]);el.style.setProperty('--t','#'+li[4])}else{el.style.removeProperty('--c');el.style.removeProperty('--t')}if(el.firstChild)el.firstChild.textContent=li?li[1]:(v.un?'?':'')}
    const D=v.route===ROUTE&&!v.un?LN.dirs[dirOf(v)]:null,tip=v.un?'Mezzo senza corsa assegnata':v.route===ROUTE?`Bus ${v.label||v.id}${D?' · verso '+pretty(D.to):''}`:`Linea ${info(v.route)?info(v.route)[1]:''} · bus ${v.label||v.id}`;
    k.m.getTooltip()?k.m.setTooltipContent(tip):k.m.bindTooltip(tip);
    k.v=v;if(!k.m.getPopup())k.m.bindPopup(()=>k.v.un?popupUn(k.v):(k.v.route===ROUTE?popup(k.v):popupOther(k.v)));
    if(fresh){const p=k.m.getLatLng();k.from=[p.lat,p.lng];k.to=[v.lat,v.lon];k.t0=performance.now();if(still||!k.seen){k.m.setLatLng(k.to);k.from=k.to}k.seen=1}
  }
  if(fresh&&!still){
    cancelAnimationFrame(animT);
    const step=t=>{let go=false;for(const id in MK){const k=MK[id],p=Math.min(1,(t-k.t0)/(POS_EVERY-2000));k.m.setLatLng([k.from[0]+(k.to[0]-k.from[0])*p,k.from[1]+(k.to[1]-k.from[1])*p]);if(p<1)go=true}if(go)animT=requestAnimationFrame(step)};
    animT=requestAnimationFrame(step);
  }
}

// Selezione linea: i dati di ogni linea sono nel file data/<id>.js, caricato solo quando serve
const loadScript=src=>new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
async function pick(id){
  ROUTE=id;ls.s('bs.line',id);renderLines(true);
  try{if(!BS.L[id])await loadScript('data/'+id+'.js')}
  catch(e){$('#dirs').innerHTML='<p class="msg">Dati della linea non trovati: serve la cartella data/ accanto a index.html.</p>';return}
  if(ROUTE!==id)return;
  LN=BS.L[id];tripDir={};tripVar={};itSel=null;for(const id2 in MK){if(M)M.removeLayer(MK[id2].m)}MK={};
  for(const t of LN.trips){tripDir[t[0]]=LN.vars[t[3]].d;tripVar[t[0]]=t[3]}
  if(!LN.dirs[dirSel])dirSel=Number(Object.keys(LN.dirs)[0]);
  initMap();drawLine();render();fitLine();
}
pick(ROUTE);loadPos();loadTu();
setInterval(()=>{if(!document.hidden)loadPos()},POS_EVERY);
setInterval(()=>{if(!document.hidden)loadTu()},TU_EVERY);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadPos();loadTu()}});
</script>
