  <style>
    :root {
      --bg: #f5f5f7;
      --text: #1d1d1f;
      --card-bg: #F5F5F5;
      --link: #0071e3;
    }

    [data-theme='dark'] {
      --bg: #1d1d1f;
      --text: #f5f5f7;
      --card-bg: #2c2c2e;
      --link: #0a84ff;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      padding: 30px 20px 10px;
      text-align: center;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      color: var(--link);
      text-decoration: none;
    }

    header h1 {
      font-size: 2.5em;
      font-weight: 600;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .controls select, .controls button {
      font-size: 1em;
      padding: 8px 12px;
      border-radius: 57px;
      border: 1px solid #ccc;
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
    }

    .news-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 30px;
      padding: 20px;
      max-width: 2500px;
      margin: auto;
    }

    .news-card {
      background-color: var(--card-bg);
      border-radius: 57px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.50);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .news-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .news-card img {
      width: 100%;
      height: 175px;
      object-fit: cover;
      background-color: #ddd;
    }

    .news-card-content {
      padding: 25px;
	height: 100px;
    }

    .news-card-title {
      font-weight: 500;
      font-size: 1.3em;
      margin-bottom: 10px;
      color: var(--link);
    }

    .news-card-source {
      font-size: 0.9em;
      color: #888;
    }

    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 57px;
      max-width: 1500px;
      max-height: 100%;
      overflow-y: auto;
      color: var(--text);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 1.5em;
      cursor: pointer;
      color: white;
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 1.8em;
      }

      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      .controls select,
      .controls button {
        width: 100%;
        font-size: 1em;
      }

      .modal-content {
        width: 90%;
        padding: 20px;
      }
    }

    @media (max-width: 480px) {
      .news-card img {
        height: 140px;
      }

      .news-card-content {
        padding: 14px;
      }

      .news-card-title {
        font-size: 1em;
      }

      .news-card-source {
        font-size: 0.8em;
      }
    }
  </style>

    const container = document.getElementById('news-container');
    const modal = document.getElementById('modal');
    const modalContent = document.getElementById('modal-content');
    const feedFilter = document.getElementById('feedFilter');
    const toggleTheme = document.getElementById('toggleTheme');

    let allArticles = [];

    feeds.forEach(feed => {
      const option = document.createElement('option');
      option.value = feed.title;
      option.textContent = feed.title;
      feedFilter.appendChild(option);
    });

    function loadFeeds() {
      allArticles = [];
      container.innerHTML = '';
      const fetches = feeds.map(feed =>
        fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`)
          .then(res => res.json())
          .then(data => {
            if (!data.items) return;
            data.items.forEach(item => {
              const article = {
                title: item.title,
                content: item.content || item.description || '',
                link: item.link,
                thumbnail: item.thumbnail || null,
                pubDate: new Date(item.pubDate),
                source: feed.title,
                sourceLogo: feed.logo
              };
              allArticles.push(article);
            });
          }).catch(e => console.error('Errore feed:', feed.title, e))
      );

      Promise.all(fetches).then(() => {
        displayArticles();
      });
    }

    function displayArticles() {
      container.innerHTML = '';
      const selected = feedFilter.value;
      const filtered = selected === 'all' ? allArticles : allArticles.filter(a => a.source === selected);
      filtered.sort((a, b) => b.pubDate - a.pubDate);

      filtered.forEach(article => {
        const card = document.createElement('div');
        card.className = 'news-card';
        card.onclick = () => openModal(article.title, article.content, article.link);

        // Se manca thumbnail, usa logo sorgente
        const imgSrc = article.thumbnail ? article.thumbnail : article.sourceLogo;

        card.innerHTML = `
          <img src="${imgSrc}" alt="Immagine notizia" onerror="this.onerror=null;this.src='${article.sourceLogo}'" />
          <div class="news-card-content">
            <div class="news-card-title">${article.title}</div>
            <div class="news-card-source">${article.source} - ${article.pubDate.toLocaleString()}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openModal(title, content, link) {
      modalContent.innerHTML = `
        <h2>${title}</h2>
        <p>${content}</p>
        <p><a href="${link}" target="_blank" rel="noopener">Leggi su sito originale →</a></p>
      `;
      modal.style.display = 'flex';
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    feedFilter.addEventListener('change', displayArticles);

    toggleTheme.addEventListener('click', () => {
      const current = document.body.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', next);
      toggleTheme.textContent = `Tema: ${next === 'light' ? 'Chiaro' : 'Scuro'}`;
    });

    loadFeeds();
    setInterval(loadFeeds, 20 * 60 * 1000); // ogni 20 minuti
