const TP={esri:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}','Tiles © Esri','Esri'],osm:['https://tile.openstreetmap.org/{z}/{x}/{y}.png','© OpenStreetMap contributors','OSM']};
let tp=ls.g('l82.tile')==='osm'?'osm':'esri';
var M=null,TL=null;let LL=null,MK={},mapAt=0,animT=0,leadLL=null,fitKey='',popCur=null;
const pad=()=>innerWidth>=800?{paddingTopLeft:[420,70],paddingBottomRight:[70,70]}:{paddingTopLeft:[30,80],paddingBottomRight:[30,($('.panel').offsetHeight||300)+40]};
const nearest=(sh,ll)=>{let bi=0,bd=1e9;sh.forEach((p,i)=>{const d=(p[0]-ll[0])**2+(p[1]-ll[1])**2;if(d<bd){bd=d;bi=i}});return bi};
const sLL=id=>[D.stops[id][1],D.stops[id][2]];
function addTiles(){if(TL)M.removeLayer(TL);const p=TP[tp];TL=L.tileLayer(p[0],{maxZoom:18,attribution:p[1]}).addTo(M);$('#tp').textContent='Mappa: '+p[2]}
function fit(){if(!M)return;const c=ST[dir],pts=[sLL(c.board),sLL(c.alight)];if(leadLL)pts.push(leadLL);M.fitBounds(pts,{...pad(),maxZoom:14})}
function fitAll(){if(!M)return;const pts=[];for(const k of vis())for(const s of ITS()[k].st)pts.push(sLL(s));if(pts.length)M.fitBounds(pts,pad())}
function initMap(){
  if(M||!window.L)return;
  M=L.map('map',{maxZoom:18,zoomControl:false});L.control.zoom({position:'bottomright'}).addTo(M);
  M.setView([44.77,10.72],11);addTiles();LL=L.layerGroup().addTo(M);
  M.on('popupopen',e=>{popCur=e.popup});M.on('popupclose',()=>{popCur=null});
  $('#fit').onpointerdown=fit;$('#all').onpointerdown=fitAll;
  $('#tp').onpointerdown=()=>{tp=tp==='esri'?'osm':'esri';ls.s('l82.tile',tp);addTiles()};
  drawLine();fit();
}
function stopPopup(id){
  const now=Date.now(),dep=departures(id,5,ST[dir].d,itSel());
  return `<b>${esc(pretty(D.stops[id][0]))}</b><div class="pl">Prossime partenze · linea 82</div>`+
    (dep.length?dep.map(e=>`<div class="dp"><b>${hm(e.t)}</b><span>verso ${esc(pretty(D.stops[e.to][0]))}</span><em>${tag(e.its)}${when(e.t,now)}${e.rt?' · '+dl(e.delay):' · da orario'}</em></div>`).join(''):'<div class="msg" style="margin:0">Nessuna partenza da questa fermata (è un capolinea di arrivo).</div>');
}
// Solo la direzione scelta: linea, tratto della figlia evidenziato, fermate
function drawLine(){
  if(!M)return;LL.clearLayers();
  const c=ST[dir],its=ITS(),h=herIt(dir),cnt={};
  for(const k of vis()){L.polyline(its[k].sh,{color:itCol(k),weight:5,opacity:.55}).addTo(LL);for(const s of its[k].st)(cnt[s]||(cnt[s]=[])).push(k)}
  if(h>=0){const sh=its[h].sh,a=nearest(sh,sLL(c.board)),b=nearest(sh,sLL(c.alight));
    L.polyline(sh.slice(Math.min(a,b),Math.max(a,b)+1),{color:itCol(h),weight:8,opacity:.95}).addTo(LL)}
  for(const id in cnt){if(id===c.board||id===c.alight)continue;const ks=cnt[id];
    L.circleMarker(sLL(id),{radius:5,weight:3,fillColor:'#fff',fillOpacity:1,color:ks.length===1?itCol(ks[0]):'#6e6e73'}).addTo(LL)
      .bindTooltip(esc(pretty(D.stops[id][0])),{direction:'top',offset:[0,-4],className:'stp'}).bindPopup(()=>stopPopup(id),{minWidth:220})
      .on('popupopen',e=>e.target.closeTooltip())}
  [[c.board,c.from,8],[c.alight,c.to,7]].forEach(([id,n,r])=>L.circleMarker(sLL(id),{radius:r,color:'#1d1d1f',weight:2,fillColor:'#fff',fillOpacity:1}).addTo(LL)
    .bindTooltip(n,{permanent:true,direction:'top',offset:[0,-8],className:'stp'}).bindPopup(()=>stopPopup(id),{minWidth:220}));
}
const CS={IN_TRANSIT_TO:'In viaggio verso',INCOMING_AT:'In arrivo a',STOPPED_AT:'Ferma a'};
function popup(v){
  const dd=D.dirs[dirOf(v)],ii=tripIts(v.trip),u=(tu()[v.trip]||[]).find(x=>x.stop_id===v.stop),x=u&&(u.arrival&&u.arrival.time?u.arrival:u.departure);
  const age=v.ts?Math.max(0,Math.round(Date.now()/1000-v.ts)):null;
  const rows=[['Corsa',dd&&'verso '+pretty(dd.to)],['Percorso',ii.length===1&&ITS().length>1&&itLab(ii[0])],['Partita alle',v.start&&v.start.slice(0,5)],['Targa',v.plate],
    [CS[v.st]||'Prossima fermata',v.stop&&D.stops[v.stop]&&pretty(D.stops[v.stop][0])],['Previsto alle',x&&x.time&&hm(x.time*1000)],['Ritardo',x&&x.delay!=null&&dl(x.delay)],
    ['Direzione',v.b!=null&&['N','NE','E','SE','S','SO','O','NO'][Math.round(v.b/45)%8]],['Aggiornato',age!=null&&age+' s fa'],['Telemetria',ageS(v)>STALE_S&&`ferma da ${Math.round(ageS(v)/60)} min`]];
  return `<b>Bus ${esc(v.label||v.id)}</b>`+rows.filter(r=>r[1]).map(r=>`<div class="pr"><span>${r[0]}</span><b>${esc(r[1])}</b></div>`).join('');
}
function popupUn(v){
  const rows=[['Stato','senza corsa assegnata'],['Targa',v.plate],['Matricola',v.label],['Aggiornato',v.ts?ageS(v)+' s fa':null],['Telemetria',ageS(v)>STALE_S&&`ferma da ${Math.round(ageS(v)/60)} min`]];
  return `<b>Mezzo non assegnato</b>`+rows.filter(r=>r[1]).map(r=>`<div class="pr"><span>${r[0]}</span><b>${esc(r[1])}</b></div>`).join('');
}
function updateMap(next){
  initMap();
  if(!M){$('#map').textContent='Mappa non disponibile: libreria non caricata.';return}
  const own=shown(),lv=next&&own.find(v=>v.trip===next.tid);leadLL=lv?[lv.lat,lv.lon]:null;
  const vs=own.concat(unas.filter(u=>nearShape([u.lat,u.lon])).map(u=>({...u,un:true,id:'u'+u.id})));
  const key=lv?dir+next.tid:'';if(key&&key!==fitKey){fitKey=key;fit()}
  const ids=new Set(vs.map(v=>v.id));
  for(const id in MK)if(!ids.has(id)){M.removeLayer(MK[id].m);delete MK[id]}
  const fresh=mapAt!==posAt;mapAt=posAt;
  const still=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
  for(const v of vs){
    let k=MK[v.id];
    if(!k)k=MK[v.id]=({m:L.marker([v.lat,v.lon],{icon:L.divIcon({className:'bmk',html:'<span>82</span>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(M),from:[v.lat,v.lon],to:[v.lat,v.lon],t0:0});
    const el=k.m.getElement();
    if(el){el.classList.toggle('on',!v.un);el.classList.toggle('un',!!v.un);el.classList.toggle('lead',!v.un&&!!next&&next.tid===v.trip);el.classList.toggle('stale',ageS(v)>STALE_S);if(el.firstChild)el.firstChild.textContent=v.un?'?':'82'}
    const dd=v.un?null:D.dirs[dirOf(v)],tip=v.un?'Mezzo senza corsa assegnata':`Bus ${v.label||v.id}${dd?' · verso '+pretty(dd.to):''}`;
    k.m.getTooltip()?k.m.setTooltipContent(tip):k.m.bindTooltip(tip);
    k.v=v;if(!k.m.getPopup())k.m.bindPopup(()=>k.v.un?popupUn(k.v):popup(k.v));
    if(fresh){const p=k.m.getLatLng();k.from=[p.lat,p.lng];k.to=[v.lat,v.lon];k.t0=performance.now();if(still||!k.seen){k.m.setLatLng(k.to);k.from=k.to}k.seen=1}
  }
  if(fresh&&!still){
    cancelAnimationFrame(animT);
    const step=t=>{let go=false;for(const id in MK){const k=MK[id],p=Math.min(1,(t-k.t0)/(POS_EVERY-2000));k.m.setLatLng([k.from[0]+(k.to[0]-k.from[0])*p,k.from[1]+(k.to[1]-k.from[1])*p]);if(p<1)go=true}if(go)animT=requestAnimationFrame(step)};
    animT=requestAnimationFrame(step);
  }
}

render();loadPos();loadTu();
setInterval(()=>{if(!document.hidden)loadPos()},POS_EVERY);
setInterval(()=>{if(!document.hidden)loadTu()},TU_EVERY);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadPos();loadTu()}});
</script>
</body>
