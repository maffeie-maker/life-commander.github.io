<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SETA Linea 82 - Correggio ↔ Bagnolo in Piano</title>
    <link rel="stylesheet" href="https://cloudflare.com" />
    <style>
        :root {
            --primary: #d32f2f;
            --secondary: #1976d2;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #212529;
            --muted: #6c757d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100%; background-color: var(--bg); color: var(--text); }
        body { display: flex; flex-direction: column; }
        
        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            z-index: 1000;
        }
        header h1 { font-size: 1.25rem; display: flex; align-items: center; gap: 10px; }
        .badge { background: white; color: var(--primary); padding: 2px 8px; border-radius: 6px; font-weight: bold; }

        .container {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .sidebar {
            width: 380px;
            background: var(--card-bg);
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 1.25rem;
            gap: 1.25rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            padding: 0.65rem 0.75rem;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        button.active, button:hover {
            background: var(--primary);
            color: white;
        }

        .btn-live {
            border-color: var(--secondary);
            color: var(--secondary);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-live:hover {
            background: var(--secondary);
            color: white;
        }

        .status-box {
            font-size: 0.85rem;
            padding: 0.75rem;
            border-radius: 8px;
            background: #e9ecef;
            color: var(--text);
            line-height: 1.4;
        }

        .timeline {
            list-style: none;
            position: relative;
            padding-left: 24px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 8px;
            bottom: 8px;
            width: 4px;
            background: var(--primary);
            border-radius: 2px;
        }
        .timeline li {
            position: relative;
            margin-bottom: 1rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            transition: background 0.15s;
        }
        .timeline li:hover { background: #f1f3f5; }
        .timeline li::before {
            content: '';
            position: absolute;
            left: -22px;
            top: 10px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: white;
            border: 3px solid var(--primary);
        }
        .timeline li:first-child::before, .timeline li:last-child::before {
            background: var(--primary);
        }
        .stop-name { font-weight: 600; font-size: 0.95rem; }
        .stop-desc { font-size: 0.8rem; color: var(--muted); }

        #map {
            flex: 1;
            height: 100%;
            min-height: 400px;
            background: #e5e3df;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column-reverse; }
            .sidebar { width: 100%; height: 45%; border-right: none; border-top: 1px solid #dee2e6; }
            #map { height: 55%; }
        }
    </style>
</head>
<body>

<header>
    <h1><span class="badge">82</span> SETA Reggio Emilia</h1>
    <span style="font-size: 0.9rem;">Correggio ↔ Bagnolo in Piano</span>
</header>

<div class="container">
    <aside class="sidebar">
        <div class="controls">
            <label style="font-size: 0.85rem; font-weight: 600; color: var(--muted);">SELEZIONA DIREZIONE</label>
            <div class="btn-group">
                <button id="btn-andata" class="active" onclick="setDirection('andata')">Correggio → Bagnolo</button>
                <button id="btn-ritorno" onclick="setDirection('ritorno')">Bagnolo → Correggio</button>
            </div>
            <button class="btn-live" onclick="fetchLiveBuses()">
                <span>📡</span> Aggiorna Bus 82 Live (JSON)
            </button>
            <div id="live-status" class="status-box">
                Premi il pulsante sopra per cercare i bus della linea 82 attivi sul feed SETA.
            </div>
        </div>

        <div>
            <h3 style="font-size: 0.95rem; margin-bottom: 0.75rem; color: var(--muted);">FERMATE PRINCIPALI</h3>
            <ul id="stops-list" class="timeline"></ul>
        </div>
    </aside>

    <main id="map">Caricamento mappa in corso...</main>
</div>

<script src="https://cloudflare.com"></script>
<script>
    const stopsData = [
        { name: "Correggio - Autostazione / Piazzale Finzi", desc: "Capolinea / Interscambio principale", lat: Number("44.7706"), lng: Number("10.7797") },
        { name: "Correggio - Porta Reggio", desc: "Fermata CORREG-P.TA RE (Viale Saltini)", lat: Number("44.7675"), lng: Number("10.7768") },
        { name: "Fosdondo - Centro", desc: "Località Fosdondo (SP468)", lat: Number("44.7641"), lng: Number("10.7385") },
        { name: "Canolo - Chiesa", desc: "Fermata CANOLO-CHIESA (Via Canolo)", lat: Number("44.7628"), lng: Number("10.7102") },
        { name: "Bagnolo in Piano - Bocciodromo", desc: "Fermata BAGNOLO-BOCCI (Via Olimpia)", lat: Number("44.7634"), lng: Number("10.6789") },
        { name: "Bagnolo in Piano - Centro / Piazza Garibaldi", desc: "Fermata centrale Bagnolo", lat: Number("44.7639"), lng: Number("10.6738") }
    ];

    let currentDirection = "andata";
    let map = null;
    let routeLayer = null;
    let markersLayer = null;
    let liveBusesLayer = null;
    let leafletMarkers = [];

    function renderStopsList() {
        const orderedStops = currentDirection === "andata" ? stopsData.slice() : stopsData.slice().reverse();
        const listEl = document.getElementById("stops-list");
        listEl.innerHTML = "";

        orderedStops.forEach((stop, index) => {
            const li = document.createElement("li");
            li.innerHTML = `<div class="stop-name">${stop.name}</div><div class="stop-desc">${stop.desc}</div>`;
            li.onclick = () => {
                if (map && leafletMarkers[index]) {
                    map.setView({ lat: stop.lat, lng: stop.lng }, 15);
                    leafletMarkers[index].openPopup();
                }
            };
            listEl.appendChild(li);
        });
    }

    function initMap() {
        renderStopsList();

        if (typeof L === "undefined") {
            document.getElementById("map").innerHTML = 
                '<div style="padding:20px;text-align:center;">⚠️ Impossibile caricare la libreria della mappa.<br>Verifica la connessione internet.</div>';
            return;
        }

        const mapDiv = document.getElementById("map");
        mapDiv.innerHTML = "";
        map = L.map("map").setView({ lat: Number("44.766"), lng: Number("10.725") }, 13);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors | Linea 82 SETA"
        }).addTo(map);

        markersLayer = L.layerGroup().addTo(map);
        liveBusesLayer = L.layerGroup().addTo(map);

        renderMapRoute();
    }

    function setDirection(dir) {
        currentDirection = dir;
        document.getElementById("btn-andata").classList.toggle("active", dir === "andata");
        document.getElementById("btn-ritorno").classList.toggle("active", dir === "ritorno");
        renderStopsList();
        if (map) renderMapRoute();
    }

    function renderMapRoute() {
        markersLayer.clearLayers();
        leafletMarkers = [];
        if (routeLayer) map.removeLayer(routeLayer);

        const orderedStops = currentDirection === "andata" ? stopsData.slice() : stopsData.slice().reverse();
        const latLngs = [];

        orderedStops.forEach((stop, index) => {
            const point = { lat: stop.lat, lng: stop.lng };
            latLngs.push(point);

            const isTerminal = index === 0 || index === orderedStops.length - 1;
            const marker = L.circleMarker(point, {
                radius: isTerminal ? 9 : 6,
                fillColor: isTerminal ? "#d32f2f" : "#ffffff",
                color: "#d32f2f",
                weight: 3,
                opacity: 1,
                fillOpacity: 1
            }).bindPopup(`<strong>${index + 1}. ${stop.name}</strong><br><small>${stop.desc}</small>`);
